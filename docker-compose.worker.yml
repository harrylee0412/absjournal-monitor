services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WORKER_NAME: journal-monitor-worker
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      CROSSREF_CONCURRENCY: ${CROSSREF_CONCURRENCY:-4}
      CROSSREF_MIN_INTERVAL_MS: ${CROSSREF_MIN_INTERVAL_MS:-200}
      JOB_LOCK_TTL_SECONDS: ${JOB_LOCK_TTL_SECONDS:-900}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
