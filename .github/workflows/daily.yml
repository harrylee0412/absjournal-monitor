name: Manual Worker Drain

on:
  workflow_dispatch:

jobs:
  worker-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      
      - run: npm ci
      
      - run: npx prisma generate
      
      - run: npm run worker:once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          CROSSREF_CONTACT_EMAIL: ${{ secrets.CROSSREF_CONTACT_EMAIL }}
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}
          BAIDU_TRANSLATE_APP_ID: ${{ secrets.BAIDU_TRANSLATE_APP_ID }}
          BAIDU_TRANSLATE_SECRET: ${{ secrets.BAIDU_TRANSLATE_SECRET }}
